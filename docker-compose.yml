version: '3.8'

services:
  # NYC Open Data MCP Server
  nyc-opendata-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nyc-opendata-mcp
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - NYC_OPENDATA_LOG_LEVEL=INFO
      - MCP_ALLOWED_HOSTS=localhost:8000,127.0.0.1:8000,::1:8000
      - SOCRATA_APP_TOKEN=${SOCRATA_APP_TOKEN:-}
      - AIRNOW_API_KEY=${AIRNOW_API_KEY:-}
      - MTA_API_KEY=${MTA_API_KEY:-}
      - WASTE_INTEL_API_KEY=${WASTE_INTEL_API_KEY:-}
    networks:
      - waste-intel-network
    depends_on:
      - postgres

  # Waste Intelligence API Server
  waste-intel-api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: waste-intel-api
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      - DB_URL=postgresql://timescale:${POSTGRES_PASSWORD:-password}@postgres:5432/wasteintel
      - ML_URL=http://ml-service:8002
      - KG_URL=http://kg-service:8003
      - API_KEY=${WASTE_INTEL_API_KEY:-}
      - REQUIRE_API_KEY=false
      - DEBUG=false
    networks:
      - waste-intel-network
    depends_on:
      - postgres

  # PostgreSQL/TimescaleDB Database
  postgres:
    image: timescale/timescaledb:latest-pg15
    container_name: timescaledb
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=timescale
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-password}
      - POSTGRES_DB=wasteintel
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - waste-intel-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U timescale -d wasteintel"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - waste-intel-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Prometheus Monitoring
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - prometheus_data:/prometheus
    networks:
      - waste-intel-network

  # Grafana Dashboard
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - waste-intel-network
    depends_on:
      - prometheus

  # MQTT Broker for IoT Sensors
  mqtt:
    image: eclipse-mosquitto:2
    container_name: mqtt-broker
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - mqtt_data:/var/lib/mosquitto
    networks:
      - waste-intel-network

  # MQTT Bridge: firmware telemetry -> Postgres
  mqtt-bridge:
    build:
      context: .
      dockerfile: devops/docker/mqtt-bridge.Dockerfile
    container_name: mqtt-bridge
    restart: unless-stopped
    environment:
      - MQTT_BROKER=mqtt
      - MQTT_PORT=1883
      - DATABASE_URL=postgresql://timescale:password@postgres:5432/wasteintel
    networks:
      - waste-intel-network
    depends_on:
      - mqtt
      - postgres

  # AI Copilot Service
  copilot-service:
    build:
      context: .
      dockerfile: copilot_service/Dockerfile
    container_name: copilot-service
    restart: unless-stopped
    ports:
      - "8004:8004"
    environment:
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENROUTER_BASE_URL=${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-openai/gpt-4o-mini}
      - WASTE_INTEL_API_URL=http://waste-intel-api:8001
      - MCP_SERVER_URL=http://nyc-opendata-mcp:8000
      - KG_API_URL=http://kg-service:8003
      - ML_API_URL=http://ml-service:8002
      - COPILOT_PORT=8004
      - COPILOT_HOST=0.0.0.0
      - COPILOT_API_KEY=${COPILOT_API_KEY:-}
      - REQUIRE_API_KEY=false
      - DEBUG=${DEBUG:-false}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    networks:
      - waste-intel-network
    depends_on:
      - waste-intel-api
      - nyc-opendata-mcp
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8004/health').raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  waste-intel-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:
  mqtt_data:
