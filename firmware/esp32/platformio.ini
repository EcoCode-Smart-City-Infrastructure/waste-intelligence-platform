[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
# Wi-Fi credentials for the waste-bin firmware. Override per deployment,
# e.g.:  pio run -e esp32dev -DWIFI_SSID='"MySSID"' -DWIFI_PASSWORD='"s3cret"'
# build_flags =
#     -DWIFI_SSID='"WASTE_MESH_WIFI"'
#     -DWIFI_PASSWORD='"changeme"'
lib_deps =
    bblanchat/ArduinoJson@^6.21.5
    adafruit/Adafruit HX711@^1.0.0
    milesburton/DallasTemperature@^3.15.0
