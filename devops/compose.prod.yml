# Production Docker Compose override
version: "3.9"

services:
  mqtt:
    restart: always
    environment:
      - MOSQUITTO_TLS_ENABLE=true
    volumes:
      - mqtt_data:/mosquitto/data
      - mqtt_logs:/mosquitto/log

  postgres:
    restart: always
    environment:
      - POSTGRES_INITDB_ARGS=-c max_connections=200
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  hub-api:
    restart: always
    environment:
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=INFO
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:-}@postgres:5432/${POSTGRES_DB:-wasteintel}
      - APP_SECRET_KEY=${APP_SECRET_KEY:?Set APP_SECRET_KEY in the environment}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  streamlit:
    restart: always
    environment:
      - STREAMLIT_LOGGER_LEVEL=info

  prometheus:
    restart: always
    volumes:
      - prometheus_data:/prometheus

  grafana:
    restart: always
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_INSTALL_PLUGINS=grafana-piechart-panel,grafana-clock-panel
    volumes:
      - grafana_data:/var/lib/grafana

volumes:
  mqtt_data:
  mqtt_logs:
  postgres_data_prod:
  prometheus_data:
  grafana_data:
