# Mosquitto MQTT Broker Configuration for WIN OS
# Production-ready configuration with security best practices

# ============================================================================
# BASIC CONFIGURATION
# ============================================================================

# Listen on all interfaces
listener 1883

# Allow anonymous access (for development, disable in production)
# Set to false and use authentication in production
allow_anonymous true

# Maximum number of connections
max_connections 10000

# Maximum inflight messages per client
max_inflight_messages 20

# Message queue size
message_size_limit 10485760  # 10MB

# Maximum queued messages
max_queued_messages 1000

# Queue bytes limit
max_queued_bytes 104857600  # 100MB

# ============================================================================
# PERSISTENCE
# ============================================================================

# Enable persistence
persistence true

# Persistence file location
persistence_location /var/lib/mosquitto/persistence/

# Auto save interval (seconds)
autosave_interval 1800

# Maximum persisted messages
max_persisted_messages 100000

# ============================================================================
# SECURITY (Production Configuration)
# ============================================================================

# Uncomment and configure for production:
# allow_anonymous false
# password_file /mosquitto/auth/passwords
# acl_file /mosquitto/auth/acls

# Enable TLS (Production)
# listener 8883
# cafile /mosquitto/certs/ca.crt
# certfile /mosquitto/certs/server.crt
# keyfile /mosquitto/certs/server.key
# require_certificate true
# use_identity_as_username true

# ============================================================================
# LOGGING
# ============================================================================

# Log destination
log_dest file

# Log file location
log_file /var/log/mosquitto/mosquitto.log

# Log type (all, error, warning, notice, information)
log_type all

# Log timestamp
log_timestamp true

# Connection logging
connection_messages true

# ============================================================================
# PERFORMANCE
# ============================================================================

# Number of threads for processing
# Set to number of CPU cores
# threads 4

# Socket buffer sizes
socket_buffer_size 65536

# ============================================================================
# MQTT v5 SUPPORT
# ============================================================================

# Enable MQTT v5 protocol
protocol mqttv311 mqttv5

# ============================================================================
# BRIDGING (Optional - for connecting to other brokers)
# ============================================================================

# Example bridge configuration (uncomment and configure as needed)
# connection win-os-bridge
# address remote-broker.example.com:1883
# remote_clientid win-os-bridge
# remote_username bridge-user
# remote_password bridge-password
# cleansession true
# start_type automatic
# notifications true
# topic # both 2

# ============================================================================
# PLUGINS (Optional)
# ============================================================================

# Load dynamic security plugin (for production)
# load_plugin /mosquitto/plugins/dynamic-security.so
# plugin_opt_config_file /mosquitto/auth/dynamic-security.conf

# ============================================================================
# WIN OS SPECIFIC CONFIGURATION
# ============================================================================

# Quality of Service settings
# 0 = At most once
# 1 = At least once  
# 2 = Exactly once
# Default QoS for WIN OS telemetry
# qos 1

# Retain flag for messages
# retain_available true

# Maximum retained messages
# max_retained_messages 1000

# ============================================================================
# INCLUDE ADDITIONAL CONFIGURATION
# ============================================================================

# Include additional configuration files
# include_file /mosquitto/config/dynamic-security.conf
