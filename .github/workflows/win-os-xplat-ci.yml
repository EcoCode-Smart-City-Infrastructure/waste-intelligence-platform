# WIN OS cross-platform CI - COPY to .github/workflows/win-os-xplat-ci.yml
# Push-triggered (works from this branch), runs the API test suite on
# Ubuntu, Windows and macOS runners so cross-OS compatibility is verified
# continuously, not asserted. The Docker stack itself is Linux-container
# based on every OS (Docker Desktop / WSL2), so the OS matrix targets the
# Python layer, scripts' syntax, and path handling.
name: win-os-xplat-ci
on:
  push:
    branches: [win-os/initial-platform]
    paths: ['win-os/**']
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install and test
        shell: bash
        run: |
          python -m pip install -r win-os/apps/api/requirements-dev.txt
          python -m compileall -q win-os/apps win-os/tools
          python -m pytest win-os/tests -q
