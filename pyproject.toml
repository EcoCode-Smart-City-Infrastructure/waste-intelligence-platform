[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "nyc-opendata-mcp"
version = "1.0.0"
description = "New York City Open Data MCP Server with Waste Intelligence Platform integration"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "EcoCode Smart City Infrastructure", email = "info@ecocode.nyc" },
]
keywords = [
    "mcp",
    "model-context-protocol",
    "nyc",
    "new-york-city",
    "open-data",
    "waste-management",
    "sustainability",
    "smart-city",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
]
dependencies = [
    "mcp>=1.0.0",
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.20.0",
    "pydantic>=2.0.0",
    "aiohttp>=3.8.0",
    "requests>=2.31.0",
    "backoff>=2.2.1",
    "psycopg2-binary>=2.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "types-requests>=2.31.0",
    "types-PyYAML>=6.0.0",
]

[project.urls]
Homepage = "https://github.com/EcoCode-Smart-City-Infrastructure/waste-intelligence-platform"
Documentation = "https://github.com/EcoCode-Smart-City-Infrastructure/waste-intelligence-platform#readme"
Repository = "https://github.com/EcoCode-Smart-City-Infrastructure/waste-intelligence-platform"
Issues = "https://github.com/EcoCode-Smart-City-Infrastructure/waste-intelligence-platform/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/nyc_opendata_mcp", "src/waste_intelligence_api"]

[tool.hatch.version]
source = "vcs"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
