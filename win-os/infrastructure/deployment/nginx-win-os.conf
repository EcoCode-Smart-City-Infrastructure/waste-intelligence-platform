# WIN OS TLS reverse proxy (host nginx). Terminate TLS here; the API itself
# listens on 127.0.0.1:8080 via the production Compose overlay.
# Get certificates with: certbot --nginx -d win.example.org
server {
    listen 80;
    server_name win.example.org;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl http2;
    server_name win.example.org;
    # ssl_certificate /etc/letsencrypt/live/win.example.org/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/win.example.org/privkey.pem;
    add_header Strict-Transport-Security "max-age=31536000" always;
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Correlation-ID $request_id;
    }
    # Never proxy monitoring or database ports; Grafana/Prometheus stay on
    # localhost / VPN by design.
}
