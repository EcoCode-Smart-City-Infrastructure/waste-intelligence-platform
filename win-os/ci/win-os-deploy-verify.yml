# WIN OS deploy verification - COPY to .github/workflows/win-os-deploy-verify.yml
# Trigger v2 (2026-11-10): GitHub only allows manual dispatch of workflows
# that exist on the DEFAULT branch, and this file lives on the feature
# branch - so the primary trigger is a push that changes the sentinel file
# win-os/ci/RUN_DEPLOY_VERIFY (Muse pushes a one-line bump to start a run;
# app pushes demonstrably trigger workflows in this repo). workflow_dispatch
# is kept for the day this lands on the default branch.
# Runs the FULL WIN OS stack on a real GitHub-hosted Ubuntu 24.04 runner:
# compose build + up (core profile), PostGIS migrations, API verification,
# edge MQTT round-trip, backup + restore - the checks that could not run in
# the development sandbox (Docker Hub was unreachable there). Public-repo
# Actions minutes are free. Nothing here deploys anywhere persistent.
# Fix v3 (2026-11-10): run #1 FAILED at Alembic - host-side alembic got
# "connection refused" on localhost:5433 even though Postgres was healthy
# and the API was ready; the published host port never became reachable on
# the runner (docker compose ps showed no published port for postgres).
# DB work (Alembic, backup) therefore runs INSIDE the Compose network
# (service name postgres:5432) via one-off `docker compose run` containers
# and never through a host-published port. The API port (8080) worked fine
# from the host, so API checks still use it.
name: win-os-deploy-verify
on:
  workflow_dispatch:
  push:
    branches: [win-os/initial-platform]
    paths: ['win-os/ci/RUN_DEPLOY_VERIFY']

jobs:
  deploy-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Prepare environment (throwaway CI secrets, never real ones)
        run: |
          cp win-os/.env.example .env
          sed -i "s/^WIN_POSTGRES_PASSWORD=.*/WIN_POSTGRES_PASSWORD=ci-throwaway-pw/" .env
          sed -i "s/^WIN_OS_KEYS=.*/WIN_OS_KEYS=ci-admin:platform_admin:org-ci,ci-op:operator:org-ci,ci-view:viewer:org-ci,ci-svc:integration:org-ci/" .env
          sed -i "s/^WIN_GRAFANA_PASSWORD=.*/WIN_GRAFANA_PASSWORD=ci-throwaway/" .env
          echo "WIN_EDGE_API_KEY=ci-svc" >> .env
          # NOTE: no WIN_DATABASE_URL is exported here any more - DB steps run
          # inside the Compose network (see Alembic step) and never use the
          # host-published Postgres port.

      - name: Build and start WIN Core
        run: |
          docker compose --env-file .env -f win-os/compose.yaml --profile core up -d --build
          docker compose --env-file .env -f win-os/compose.yaml --profile core ps

      - name: Wait for API readiness
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/health/ready; then echo; echo "API ready"; exit 0; fi
            sleep 5
          done
          echo "API never became ready"; docker compose --env-file .env -f win-os/compose.yaml logs api | tail -100; exit 1

      # Run #1 failed here: host-side Alembic could not reach localhost:5433
      # (connection refused) even though Postgres was healthy and the API
      # was ready, because the published host port never became reachable
      # on the runner. Run Alembic INSIDE the Compose network instead: a
      # one-off container from the already-built API image (which ships
      # alembic) with the migrations directory mounted, talking to
      # postgres:5432 over win-internal. No host port involved.
      - name: Run Alembic migrations against the Compose Postgres
        run: |
          docker compose --env-file .env -f win-os/compose.yaml --profile core run --rm --no-deps \
            -v "$PWD/win-os/data-platform/migrations:/migrations:ro" \
            -w /migrations \
            -e WIN_DATABASE_URL=postgresql+psycopg://winos:ci-throwaway-pw@postgres:5432/winos \
            api alembic upgrade head
          docker compose --env-file .env -f win-os/compose.yaml --profile core run --rm --no-deps \
            -v "$PWD/win-os/data-platform/migrations:/migrations:ro" \
            -w /migrations \
            -e WIN_DATABASE_URL=postgresql+psycopg://winos:ci-throwaway-pw@postgres:5432/winos \
            api alembic current

      - name: Verify deployment (shipped script)
        env:
          WIN_API_URL: http://127.0.0.1:8080
          WIN_API_KEY_OPERATOR: ci-op
          WIN_API_KEY_VIEWER: ci-view
        run: bash win-os/infrastructure/deployment/verify-deployment.sh

      - name: Seed + smoke the v0.2 surface
        run: |
          export WIN_API_URL=http://127.0.0.1:8080 WIN_API_KEY=ci-op
          python win-os/tools/seed_win_os.py
          curl -fsS -H "X-API-Key: ci-admin" http://127.0.0.1:8080/api/v1/system/status
          curl -fsS -H "X-API-Key: ci-view" http://127.0.0.1:8080/api/v1/data-quality/summary

      # pg_dump is not installed on the GitHub runner, and the host-published
      # Postgres port is not relied on (see Alembic step). The shipped backup
      # script therefore runs inside the Compose network in a one-off
      # container from the Postgres image (which ships pg_dump), with the
      # script and the host ./backups directory mounted; it writes the dump
      # there, and restore-check.sh then runs on the host as before.
      - name: Backup and restore check
        run: |
          mkdir -p backups
          docker compose --env-file .env -f win-os/compose.yaml --profile core run --rm --no-deps \
            -v "$PWD/win-os/infrastructure/backup-restore:/scripts:ro" \
            -v "$PWD/backups:/backups" \
            -e WIN_DATABASE_URL=postgresql://winos:ci-throwaway-pw@postgres:5432/winos \
            -e WIN_BACKUP_DIR=/backups \
            postgres bash /scripts/backup-win-os.sh
          WIN_BACKUP_DIR=$PWD/backups bash win-os/infrastructure/backup-restore/restore-check.sh

      - name: Start intelligence + monitoring + edge profiles
        run: |
          docker compose --env-file .env -f win-os/compose.yaml --profile intelligence --profile monitoring --profile edge up -d --build
          docker compose --env-file .env -f win-os/compose.yaml --profile core --profile intelligence --profile monitoring --profile edge ps

      - name: Dump logs on failure
        if: failure()
        run: docker compose --env-file .env -f win-os/compose.yaml --profile core --profile intelligence --profile monitoring --profile edge logs | tail -300
